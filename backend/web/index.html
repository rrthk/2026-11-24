<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학교 출석 관리자</title>
<style>
body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f4f6fa;color:#202938;max-width:1000px;margin:30px auto;padding:0 16px}
.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd4df;margin:4px;box-sizing:border-box}input{max-width:100%}button{cursor:pointer;background:#2459d3;color:white;border:0}button.secondary{background:#e9edf5;color:#253047}.row{display:flex;flex-wrap:wrap;gap:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #edf0f4;padding:9px}.muted{color:#667085}.hidden{display:none}.warn{color:#b54708;font-weight:700}
</style></head><body>
<h1>학교 출석 관리자</h1><p class="muted">건물·수업을 등록하고 학생 체류 기록을 확인합니다.</p>
<section class="card" id="login">
<h2>관리자 로그인</h2><div class="row"><input id="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button onclick="login()">로그인</button></div><p id="loginMsg" class="muted"></p></section>
<main id="app" class="hidden">
<section class="card"><h2>건물 등록</h2><div class="row"><input id="bname" placeholder="건물/강의동 이름"><input id="lat" type="number" step="any" placeholder="위도"><input id="lon" type="number" step="any" placeholder="경도"><input id="radius" type="number" value="80" placeholder="반경(m)"><button onclick="addBuilding()">건물 저장</button><button class="secondary" onclick="useGPS()">현재 위치 가져오기</button></div><div id="buildings"></div></section>
<section class="card"><h2>수업 세션 생성</h2><div class="row"><input id="title" placeholder="수업명"><input id="buildingId" type="number" placeholder="건물 ID"><label>시작 <input id="starts" type="datetime-local"></label><label>종료 <input id="ends" type="datetime-local"></label><button onclick="addSession()">수업 생성</button></div></section>
<section class="card"><h2>수업 목록 및 체류 보고서</h2><div id="sessions"></div><div id="report"></div></section>
<section class="card"><h2>학생 계정 생성</h2><div class="row"><input id="sname" placeholder="학생 이름"><input id="semail" placeholder="학교 이메일"><input id="spass" type="password" placeholder="임시 비밀번호(12자 이상)"><button onclick="addStudent()">학생 생성</button></div><p id="studentMsg" class="muted"></p></section>
<button class="secondary" onclick="logout()">로그아웃</button></main>
<script>
let token=localStorage.getItem('school_admin_token')||'';
const $=id=>document.getElementById(id);
async function api(path,opts={}){let r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(d.detail||'요청 실패');return d}
async function login(){try{let f=new URLSearchParams({username:$('email').value,password:$('password').value});let r=await fetch('/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f});let d=await r.json();if(!r.ok)throw Error(d.detail);if(d.role!=='admin')throw Error('관리자 계정이 아닙니다.');token=d.access_token;localStorage.setItem('school_admin_token',token);show();}catch(e){$('loginMsg').textContent=e.message}}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');refresh()}
function logout(){token='';localStorage.removeItem('school_admin_token');location.reload()}
async function useGPS(){navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude},e=>alert(e.message),{enableHighAccuracy:true})}
async function addBuilding(){try{await api('/admin/buildings',{method:'POST',body:JSON.stringify({name:$('bname').value,latitude:$('lat').value,longitude:$('lon').value,radius_m:$('radius').value})});alert('건물을 저장했습니다.');refresh()}catch(e){alert(e.message)}}
async function addSession(){try{let b=await api('/admin/sessions',{method:'POST',body:JSON.stringify({title:$('title').value,building_id:$('buildingId').value,starts_at:new Date($('starts').value).toISOString(),ends_at:new Date($('ends').value).toISOString()})});alert('수업 생성 완료. 세션 ID: '+b.id);refresh()}catch(e){alert(e.message)}}
async function addStudent(){try{let d=await api('/admin/students',{method:'POST',body:JSON.stringify({display_name:$('sname').value,email:$('semail').value,password:$('spass').value})});$('studentMsg').textContent='학생 계정 생성 완료: '+d.email}catch(e){$('studentMsg').textContent=e.message}}
async function refresh(){try{let [bs,ss]=await Promise.all([api('/admin/buildings'),api('/admin/sessions')]);$('buildings').innerHTML='<p>'+bs.map(b=>`ID ${b.id}: ${b.name} (${b.latitude}, ${b.longitude}), 반경 ${b.radius_m}m`).join('<br>')+'</p>';$('sessions').innerHTML='<table><tr><th>ID</th><th>수업</th><th>시작</th><th>종료</th><th>보고서</th></tr>'+ss.map(s=>`<tr><td>${s.id}</td><td>${s.title}</td><td>${new Date(s.starts_at).toLocaleString()}</td><td>${new Date(s.ends_at).toLocaleString()}</td><td><button onclick="loadReport(${s.id})">보기</button></td></tr>`).join('')+'</table>'}catch(e){if(token){alert(e.message);logout()}}}
async function loadReport(id){try{let d=await api('/admin/reports/'+id);$('report').innerHTML=`<h3>${d.session} · 학생 ${d.count}명</h3><p>평균 ${d.mean_minutes}분 / 표준편차 ${d.std_minutes}분</p><table><tr><th>학생</th><th>체류(분)</th><th>마지막 위치</th><th>정확도</th><th>판정</th></tr>${d.results.map(x=>`<tr><td>${x.student}</td><td>${x.minutes}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleTimeString():'미수신'}</td><td>${x.accuracy_m??'-'}m</td><td class="${x.anomaly_candidate?'warn':''}">${x.anomaly_candidate?'이상치 후보':'확인 필요/일반'}</td></tr>`).join('')}</table>`}catch(e){alert(e.message)}}
if(token)show();
</script></body></html>
